version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -z "$VITE_API_BASE_URL" ]; then echo "Set VITE_API_BASE_URL in Amplify environment variables"; exit 1; fi
        - npm ci
    build:
      commands:
        - npm test
        - npm run lint
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
